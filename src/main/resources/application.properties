quarkus.application.name=gestione-spese-online

# --- MongoDB ---
# Nome del database (sovrascrivibile da variabile d'ambiente)
quarkus.mongodb.database=${MONGODB_DATABASE:gestione-spese}

# In dev e test la connection string NON e' impostata: Quarkus Dev Services
# avvia automaticamente un container MongoDB (serve Docker attivo).
# In prod (container) la connection string arriva da variabile d'ambiente.
%prod.quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}

# --- CORS ---
# Il frontend (Angular) gira su un'origine diversa dal backend (porta 4200 sia in sviluppo
# con "ng serve" sia nel container): il browser lo consente solo se il backend lo autorizza.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PATCH,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept
