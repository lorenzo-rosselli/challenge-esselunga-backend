# Avvio completo: MongoDB + backend + frontend
#   1) ./mvnw package          (genera target/quarkus-app)
#   2) docker compose up --build
# Frontend: http://localhost:4200   Backend: http://localhost:8080
# Il frontend viene costruito dalla cartella ../frontend (repository affiancato al backend).
services:

  mongodb:
    image: mongo:8.0
    container_name: gestione-spese-mongodb
    # --quiet: niente log per ogni connessione aperta/chiusa (es. quelle dell'healthcheck ogni 10s)
    command: ["mongod", "--quiet"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    image: gestione-spese-online-backend:latest
    container_name: gestione-spese-backend
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: gestione-spese
      CORS_ORIGINS: http://localhost:4200
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: gestione-spese-online-frontend:latest
    container_name: gestione-spese-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mongo-data:
